# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: none  # Manual trigger only

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'
  
- script: ls -R
  displayName: 'Debug: List files in workspace'

- script: npm install --legacy-peer-deps
  displayName: 'Install dependencies'
  workingDirectory: FlowCus-frontend/flowcus

  
- script: |
    cd FlowCus-frontend/flowcus
    # Configure Git using pipeline variables
    git config --global user.email "$(GITHUB_EMAIL)"
    git config --global user.name "$(GITHUB_USERNAME)"
    # Update the remote URL using the GitHub PAT for authentication
    git remote set-url origin https://$(GITHUB_PAT)@github.com/$(GITHUB_USERNAME)/$(GITHUB_REPO).git
    export GH_TOKEN=$(GITHUB_PAT)  # Set token as an environment variable
    npx ng deploy --no-silent
  displayName: 'Deploy Angular app to GitHub Pages'
  workingDirectory: FlowCus-frontend/flowcus  # Ensure correct path
