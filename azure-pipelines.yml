# Docker
# Build and test FlowCus backend image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET Core SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: 'FlowCus-backend/FlowCus.sln'
        arguments: '-c Release'

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/FlowCus-backend/Dockerfile'
        tags: |
          $(tag)

- stage: Deploy
  displayName: Deploy Docker image
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "Deploying Docker image to deployment platform"
        curl -X POST \
        -H "Authorization: Bearer ${RENDER_API_KEY}" \
        -d '{"branch":"main"}' \
        "https://api.render.com/v1/services/${FLOWCUS_SERVICE_ID}/deploys"
      displayName: 'Deploy to Render'