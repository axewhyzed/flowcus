<header class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <h1 class="text-2xl font-bold text-blue-600">FlowCus</h1>

        <!-- Desktop Navigation -->
        <nav class="hidden md:ml-8 md:flex md:space-x-8">
          <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-link">Dashboard</a>
          <a routerLink="/tasks" routerLinkActive="active-link" class="nav-link">Tasks</a>
          <a routerLink="/task-types" routerLinkActive="active-link" class="nav-link">Categories</a>
          <a routerLink="/timetables" routerLinkActive="active-link" class="nav-link">Timetables</a>
          <a routerLink="/timetable-items" routerLinkActive="active-link" class="nav-link">Timetable Items</a>
          <a routerLink="/user" routerLinkActive="active-link" class="nav-link">Profile</a>
        </nav>
      </div>

      <!-- User Menu -->
      <div class="hidden md:flex md:items-center md:space-x-4">
        @if (username) {
          <span class="text-gray-700">Hello, {{ username }}</span>
        }
        <button (click)="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="text-gray-400 hover:text-gray-500">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (!isMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            }
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    @if (isMenuOpen) {
      <div class="md:hidden border-t border-gray-200 pt-4 pb-4">
        <nav class="space-y-1">
          <a routerLink="/dashboard" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Dashboard</a>
          <a routerLink="/tasks" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Tasks</a>
          <a routerLink="/task-categories" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Categories</a>
          <a routerLink="/task-subtypes" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Subtypes</a>
          <a routerLink="/timetables" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Timetables</a>
          <a routerLink="/timetable-items" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Timetable Items</a>
          <a routerLink="/user" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-nav-link">Profile</a>
        </nav>
      </div>
    }
  </div>
</header>
