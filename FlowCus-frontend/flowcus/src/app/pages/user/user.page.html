@if (user) {
  <div class="min-h-screen bg-white p-6 md:p-8 font-sans">
    <div class="mx-auto w-full max-w-xl">
      <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-xl font-semibold text-blue-700">User Profile</h1>
          @if (user.isAdmin) {
            <span class="text-xs px-2 py-1 rounded-full border border-blue-200 text-blue-700 bg-blue-50">Admin</span>
          }
        </div>

        <form (ngSubmit)="updateUser()" class="grid gap-4" autocomplete="on" novalidate>
          <label class="grid gap-1">
            <span class="text-xs font-medium text-zinc-500">Username</span>
            <input
              type="text"
              [value]="user.username"
              disabled
              class="block w-full rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2.5 text-sm text-zinc-900 outline-none"
            />
          </label>

          <label class="grid gap-1">
            <span class="text-xs font-medium text-zinc-500">Name</span>
            <input
              [(ngModel)]="user.name"
              name="name"
              type="text"
              placeholder="Enter full name"
              class="block w-full rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-500/20 transition-colors"
              required
            />
          </label>

          <div class="flex items-center justify-end gap-3">
            <button
              type="submit"
              [disabled]="!user.name || user.name.trim().length === 0"
              class="rounded-xl bg-blue-600 text-white text-sm font-semibold px-4 py-2.5 transition hover:bg-blue-500 active:translate-y-px disabled:opacity-60 disabled:cursor-not-allowed"
            >
              Save changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
} @else {
  <!-- Lightweight skeleton while loading -->
  <div class="min-h-screen bg-white p-6 md:p-8">
    <div class="mx-auto w-full max-w-xl">
      <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
        <div class="h-6 w-40 rounded bg-zinc-100 mb-4 animate-pulse"></div>
        <div class="space-y-3">
          <div class="h-10 w-full rounded bg-zinc-100 animate-pulse"></div>
          <div class="h-10 w-full rounded bg-zinc-100 animate-pulse"></div>
          <div class="h-10 w-28 rounded bg-zinc-100 animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>
}
