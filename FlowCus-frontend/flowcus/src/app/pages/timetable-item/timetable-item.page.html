<div class="container mt-4">
  <h2>Add Timetable Item</h2>
  
  <form (ngSubmit)="save()">
    <div class="mb-3">
      <label>Day of Week</label>
      <select class="form-select" [(ngModel)]="item.dayOfWeek" name="dayOfWeek">
        <option [ngValue]="0">Sunday</option>
        <option [ngValue]="1">Monday</option>
        <option [ngValue]="2">Tuesday</option>
        <option [ngValue]="3">Wednesday</option>
        <option [ngValue]="4">Thursday</option>
        <option [ngValue]="5">Friday</option>
        <option [ngValue]="6">Saturday</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Category</label>
      <select class="form-select" [(ngModel)]="item.taskCategoryId" name="categoryId" required>
        <option [ngValue]="undefined" disabled>Select a Category</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label>Start Time</label>
      <input type="time" class="form-control" [(ngModel)]="item.startTime" name="startTime" step="1" required>
    </div>

    <div class="mb-3">
      <label>End Time</label>
      <input type="time" class="form-control" [(ngModel)]="item.endTime" name="endTime" step="1" required>
    </div>

    <button type="submit" class="btn btn-primary">Save Item</button>
  </form>
</div>
