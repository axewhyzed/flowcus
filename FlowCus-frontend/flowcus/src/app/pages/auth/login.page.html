<div class="min-h-screen bg-gradient-to-b from-zinc-50 to-white flex items-center justify-center p-6 font-sans">
  <div class="w-full max-w-sm bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-lg shadow-zinc-200/60">
    <div class="mb-4">
      <h1 class="text-xl font-semibold text-zinc-900">Welcome back</h1>
      <p class="text-sm text-zinc-500">Sign in to continue</p>
    </div>

    <form (ngSubmit)="submit()" autocomplete="on" novalidate class="grid gap-3">
      <input
        [(ngModel)]="username"
        name="username"
        type="text"
        inputmode="email"
        autocomplete="username"
        placeholder="Username"
        aria-label="Username"
        required
        class="block w-full rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/20 transition-colors"
      />

      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        aria-label="Password"
        required
        class="block w-full rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/20 transition-colors"
      />

      <!-- Registration UI stays hidden unless ?mode=register -->
      @if (isRegister) {
        <input
          [(ngModel)]="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Full name"
          aria-label="Full name"
          required
          class="block w-full rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/20 transition-colors"
        />
      }

      <button
        type="submit"
        [disabled]="!username || !password"
        class="w-full rounded-xl bg-blue-700 text-white text-sm font-semibold py-2.5 transition hover:bg-blue-500 active:translate-y-px disabled:opacity-60 disabled:cursor-not-allowed"
      >
        Continue
      </button>
    </form>
  </div>
</div>
