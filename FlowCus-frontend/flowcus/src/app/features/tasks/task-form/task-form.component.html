<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <!-- Background overlay -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" (click)="onCancel()"></div>

    <!-- Modal panel -->
    <div class="inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
        <!-- Header -->
        <div class="mb-6">
          <h3 class="text-lg font-medium leading-6 text-gray-900">{{ formTitle }}</h3>
          <p class="mt-1 text-sm text-gray-500">
            {{ isEditMode ? 'Update the task details below.' : 'Fill in the details to create a new task.' }}
          </p>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
          {{ error }}
        </div>

        <!-- Form Fields -->
        <div class="space-y-6">
          <!-- Title -->
          <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
              Title <span class="text-red-500">*</span>
            </label>
            <input type="text" 
                   id="title"
                   formControlName="title"
                   class="form-input"
                   [class.border-red-300]="isFieldInvalid('title')"
                   [class.focus:ring-red-500]="isFieldInvalid('title')"
                   [class.focus:border-red-500]="isFieldInvalid('title')"
                   placeholder="Enter task title">
            <p *ngIf="getFieldError('title')" class="mt-1 text-sm text-red-600">
              {{ getFieldError('title') }}
            </p>
          </div>

          <!-- Description -->
          <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
              Description
            </label>
            <textarea id="description"
                      formControlName="description"
                      rows="3"
                      class="form-input"
                      [class.border-red-300]="isFieldInvalid('description')"
                      [class.focus:ring-red-500]="isFieldInvalid('description')"
                      [class.focus:border-red-500]="isFieldInvalid('description')"
                      placeholder="Enter task description (optional)"></textarea>
            <p *ngIf="getFieldError('description')" class="mt-1 text-sm text-red-600">
              {{ getFieldError('description') }}
            </p>
          </div>

          <!-- Priority -->
          <div>
            <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">
              Priority <span class="text-red-500">*</span>
            </label>
            <select id="priority" 
                    formControlName="priority"
                    class="form-select"
                    [class.border-red-300]="isFieldInvalid('priority')"
                    [class.focus:ring-red-500]="isFieldInvalid('priority')"
                    [class.focus:border-red-500]="isFieldInvalid('priority')">
              <option [value]="TaskPriority.High">High Priority</option>
              <option [value]="TaskPriority.Normal">Normal Priority</option>
              <option [value]="TaskPriority.Low">Low Priority</option>
            </select>
            <p *ngIf="getFieldError('priority')" class="mt-1 text-sm text-red-600">
              {{ getFieldError('priority') }}
            </p>
          </div>

          <!-- Time Range -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">
                Start Time
              </label>
              <input type="datetime-local" 
                     id="startTime"
                     formControlName="startTime"
                     class="form-input">
            </div>
            <div>
              <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">
                End Time
              </label>
              <input type="datetime-local" 
                     id="endTime"
                     formControlName="endTime"
                     class="form-input">
            </div>
          </div>

          <!-- Completion Status (only for edit mode) -->
          <div *ngIf="isEditMode">
            <div class="flex items-center">
              <input type="checkbox" 
                     id="isCompleted"
                     formControlName="isCompleted"
                     class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
              <label for="isCompleted" class="ml-2 text-sm font-medium text-gray-700">
                Mark as completed
              </label>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-3 space-y-3 space-y-reverse sm:space-y-0">
          <button type="button" 
                  (click)="onCancel()"
                  class="w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-md shadow-sm bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Cancel
          </button>
          <button type="submit" 
                  [disabled]="taskForm.invalid || isSubmitting"
                  class="w-full sm:w-auto px-4 py-2 border border-transparent rounded-md shadow-sm bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ submitButtonText }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
