<div class="bg-white rounded-lg shadow border hover:shadow-lg transition-all duration-200 overflow-hidden"
     [class.opacity-60]="task.isCompleted"
     [class.border-l-4]="true"
     [class.border-l-red-500]="task.priority === TaskPriority.High"
     [class.border-l-yellow-500]="task.priority === TaskPriority.Normal"
     [class.border-l-green-500]="task.priority === TaskPriority.Low">
  
  <!-- Card Header -->
  <div class="p-4 pb-2">
    <div class="flex items-start justify-between">
      <div class="flex items-center space-x-3 flex-1">
        <!-- Completion Toggle -->
        <button (click)="onToggle()" 
                class="flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors duration-200"
                [class.bg-green-500]="task.isCompleted"
                [class.border-green-500]="task.isCompleted"
                [class.border-gray-300]="!task.isCompleted"
                [class.hover:border-green-400]="!task.isCompleted">
          <svg *ngIf="task.isCompleted" class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
        </button>

        <!-- Task Title -->
        <h3 class="text-lg font-semibold text-gray-900 flex-1"
            [class.line-through]="task.isCompleted"
            [class.text-gray-500]="task.isCompleted">
          {{ task.title }}
        </h3>

        <!-- Priority Badge -->
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border"
              [class]="getPriorityClass()">
          <svg class="w-3 h-3 mr-1" [class]="getPriorityIconClass()" fill="currentColor" viewBox="0 0 20 20">
            <path *ngIf="task.priority === TaskPriority.High" fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            <path *ngIf="task.priority === TaskPriority.Normal" fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
            <path *ngIf="task.priority === TaskPriority.Low" fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          {{ task.priority | priority }}
        </span>
      </div>
    </div>
  </div>

  <!-- Card Body -->
  <div class="px-4 pb-2">
    <p class="text-gray-600 text-sm leading-relaxed" 
       [class.line-through]="task.isCompleted"
       *ngIf="task.description">
      {{ task.description }}
    </p>
  </div>

  <!-- Card Metadata -->
  <div class="px-4 py-3 bg-gray-50 border-t border-gray-100">
    <div class="flex items-center justify-between text-xs text-gray-500">
      <div class="flex items-center space-x-4">
        <!-- Time Info -->
        <div *ngIf="task.startTime || task.endTime" class="flex items-center space-x-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>
            <span *ngIf="task.startTime">{{ formatTime(task.startTime) }}</span>
            <span *ngIf="task.startTime && task.endTime"> - </span>
            <span *ngIf="task.endTime">{{ formatTime(task.endTime) }}</span>
          </span>
        </div>

        <!-- Duration -->
        <div *ngIf="task.durationSeconds" class="flex items-center space-x-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span>{{ formatDuration() }}</span>
        </div>

        <!-- Created Date -->
        <div class="flex items-center space-x-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span>{{ task.createdOn | date:'short' }}</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <button (click)="onEdit()" 
                class="text-blue-600 hover:text-blue-800 transition-colors duration-200"
                title="Edit task">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>
        
        <button (click)="onDelete()" 
                class="text-red-600 hover:text-red-800 transition-colors duration-200"
                title="Delete task">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
