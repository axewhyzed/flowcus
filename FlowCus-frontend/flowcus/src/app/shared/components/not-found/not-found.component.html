<div class="min-h-screen bg-slate-50 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 text-slate-900">
  <div class="max-w-md w-full text-center space-y-6">
    
    <!-- 404 Badge & Monospace Code -->
    <div class="space-y-2">
      <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400">
        <i class="fa-solid fa-compass text-sm"></i>
      </div>
      <div class="text-4xl font-mono font-semibold text-slate-900 tracking-tight">404</div>
      <h1 class="text-base font-semibold text-slate-900">Page not found</h1>
      <p class="text-xs text-slate-500 leading-relaxed max-w-sm mx-auto">
        The route you are navigating to does not exist or has been moved to another path.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-center gap-2 pt-2">
      <button (click)="goBack()" 
        class="h-8 px-3 text-xs font-medium text-slate-700 bg-white border border-slate-200 rounded-md hover:bg-slate-50 transition-colors shadow-2xs flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>Go Back</span>
      </button>
      
      <a routerLink="/dashboard" 
        class="h-8 px-3.5 text-xs font-medium text-white bg-slate-900 hover:bg-slate-800 rounded-md transition-colors shadow-2xs flex items-center gap-1.5">
        <i class="fa-solid fa-house text-[10px]"></i>
        <span>Dashboard</span>
      </a>
    </div>

    <!-- Quick Links -->
    <div class="pt-6 border-t border-slate-200/80 flex items-center justify-center gap-4 text-xs font-medium text-slate-500">
      <a routerLink="/tasks" class="hover:text-slate-900 transition-colors">Tasks</a>
      <span class="text-slate-300">•</span>
      <a routerLink="/timetables" class="hover:text-slate-900 transition-colors">Timetables</a>
      <span class="text-slate-300">•</span>
      <a routerLink="/task-types" class="hover:text-slate-900 transition-colors">Taxonomies</a>
    </div>
  </div>
</div>
